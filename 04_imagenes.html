<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagenes</title>

</head>
<body>
    <!-- Etiquetas de Bloque y Etiquetas de Linea -->
    <h1>imagenes</h1>
    <!-- Las imagenes se insertan en HTML utilizando la etiqueta img. esta etiqueta es un elemento vacio, lo que significa que no tiene un elemento de cierre. La sintaxis basica para insertar una imagen es: -->

    <!-- vale recordar que el atributo tittle proporciona un tooltip que se muestra cuando el usuario pasa el mouse sonbre la imagen -->
    <img src="04_imagen.png" alt="Logotipo de la herramienta de desarrollo Appcelerator Titanium" title="Appcelerator Titanium" width="200" height="200">
    <!-- Para los lectores de pantalla puedan saber de que se trata la imagen el atributo alt(alternative text) es muy importante puesto que proporciona una descripcion textual de la imagen para accesibilidad y como fallback si no se carga. El texto alternativo debe de ser descriptivo y conciso, y debe trasmitir la informacion esencial que la imagen representa. Por ejemplo, si la imagen es un logotipo de una empresa, el texto alternativo podria ser "logotipo de la empresa XYZ". Si la imagen es una fotografia de un paisaje, el texto alternativo podria ser "fotografia de un paisaje comn montañas y lagos". en resumen el atributo alt proporciona una descripcion de la imagen en caso de que no se pueda cargar -->

    <!-- self closing tags son etiquetas que se auto cierran -->

</body>
</html>
