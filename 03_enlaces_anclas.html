<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <!-- Los enlaces, anclas o hipervinculos -->
    <!-- a (anchor) significa ancla. Metafora: como en un barco te mantiene en una ubicacion especifica. Un ancla es precisamente para que un usuario sepa hacia donde buscar un recurso o hacia donde navegar en la pagina web. -->

    <!-- los atributos son caracteristicas que definen el comportamiento y la apariencia de los elementos en este caso el atributo href vuelve funcional a la etiqueta es por esta razon que se utiliza en el maquetado y no en el css dado que no es una caracteristica visual. -->

    <!-- href (hyper reference) es la referencia a un recurso, es decir, el destino del enlace -->
    <!-- lo que esta dentro de la etiqueta a es el texto visible que el usuario vera en la pagina web. lientras que lo que esta en href es la referencia al recurso al que apunta el enlace. -->
    <h2 title="titulo de la pagina">Enlaces o anclas</h2>
    <!-- por otra parte, el atributo tittle proporciona un texto de ayuda que se muestra cuando el usuario pasa el mouse sobre el enlace. las tecnologias de asistencia como lectores de pantalla utilizan este atributo para proporcionar informacion adicional al usuario. en el caso de personas invidentes esto les permite acceder a informacion adicional sobre el enlace. -->

    <a href="https://www.google.com">Google</a>
    <br>
    <a href="https://www.facebook.com">Facebook</a>
    <br>
    <a href="https://www.youtube.com">Youtube</a>
    <br>
    <a title="ir al canal de youtube" href="https://www.youtube.com/@ramcrack0584">ramcrack</a> <!-- Mala practica: usar protocolo relativo sin especificar el protocolo -->
    <br>
    <br>
    <a href="03-1_pagina_enlaces1.html">ir al enlace uno</a>
    <br>
    <a href="03-2_pagina_enlaces2.html">ir al enlace dos</a>
    <br>
    <a href="03-3_pagina_enlaces3.html">ir al enlace tres</a>
    <!-- Es sumamente importante que en la programacion y el desarrollo web realicen se realizen las precticas a medida que se avanza, de esta manera se asegura una mejor comprension y aplicacion de los conceptos aprendidoa. Entiendan que en la programaciones un proceso activo no pasivo, una cosa es intentar comprender lo que sucede cuando leen o ven algo que se trata haciendo, sin embargo, la unica manera es probando ustedes mismos todo lo que se debe inplementar  -->
    <br>

    <h2>Enlaces con target a otra ventana</h2>
    <a href="03-4_pagina_enlaces4.html" target="_blank">ir a enlace 4 en nueva pestaña</a>
    <!-- El atributo target="_blank" abre en enlace en una nueva ventana o en un nuego navegador. por defecto siempre esta en self que significa que se abre en la visma ventana -->
</body>
</html>
